[package]
name = "saturn"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
zip = "2"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
