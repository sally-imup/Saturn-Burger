name: Build Saturn

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Tanda tangan digital (opsional). Isi secrets ini di repo supaya build otomatis ditandatangani:
#   SIGN_CERT_BASE64  = isi file .pfx dalam base64
#   SIGN_CERT_PASSWORD = password .pfx
env:
  SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
  SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}

jobs:
  build:
    name: Build installer (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Sign saturn.exe
        if: ${{ env.SIGN_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:SIGN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Saturn" target\release\saturn.exe

      - name: Set version
        shell: pwsh
        run: |
          # Tag v0.2.0 -> versi 0.2.0. Pastikan sama dengan version di Cargo.toml.
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\saturn.exe dist\
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" installer\saturn.iss

      - name: Sign installer
        if: ${{ env.SIGN_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $setup = (Get-ChildItem dist\Saturn-*-Setup.exe).FullName
          & $signtool.FullName sign /f $pfx /p $env:SIGN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Saturn Setup" $setup

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: saturn-setup
          path: dist/Saturn-*-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Saturn-*-Setup.exe
          generate_release_notes: true
